<!doctype html>
<meta charset="utf-8">
<!-- The Header and Search Results art. art.mjs captures it at each size.
     What the App Store shows of these on an iPhone is only about the middle 40% of the width and the
     upper-middle half of the height (from about 17% to 58%), zoomed in, with the icon and the name
     printed right under it. Phone screenshots can't be read at that size (they were tried first), so,
     as in Recommendation Journal's: the app's name and a short line, and two of the app's own check-in
     cards drawn big, all inside that small area. The rest is background. ?guide=1 outlines the area. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; color: #e8eaf6;
    background: radial-gradient(ellipse 40% 50% at 50% 38%, rgba(159,168,255,0.30), transparent 72%),
                linear-gradient(160deg, #1c2046 0%, #0e1120 75%);
  }
  .guide { display: none; position: absolute; left: 30vw; width: 40vw; top: 17vh; height: 41vh; outline: 0.4vh dashed #f66; }
  body.show-guide .guide { display: block; }
  .cards { display: flex; flex-direction: column; gap: 1.2vh; position: absolute; left: 50%; top: 37.5%;
    transform: translate(-50%, -50%); width: min(35vw, 64vh); }
  .title { text-align: center; margin-bottom: 0.6vh; }
  .title b { display: block; font-size: min(4.4vh, 2.5vw); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .title b span { color: #ffc47a; }
  .title i { display: block; font-style: normal; font-size: min(2.5vh, 1.45vw); color: #b9bee0; margin-top: 0.3vh; }
  /* The Journal's two check-ins, in their colors: bedtime blue, morning amber, each with its ✓. */
  .card { --c: #9fa8ff; background: #171b38; border: 0.25vh solid #2a3170; border-left: 0.9vh solid var(--c); border-radius: 1.8vh;
    padding: 1.1vh 2vh; display: flex; align-items: center; gap: 1.8vh; box-shadow: 0 1.5vh 4vh rgba(0,0,0,0.45); }
  .card:nth-of-type(2) { transform: rotate(-1.2deg) translateX(-1.2vh); }
  .card:nth-of-type(3) { transform: rotate(1deg) translateX(1.2vh); }
  .card.morning { --c: #ffc47a; background: #231d12; border-color: #57431d; border-left-color: var(--c); }
  .card .ic { font-size: 3.4vh; color: var(--c); }
  .card div { flex: 1; min-width: 0; }
  .card b { display: block; font-size: 3vh; line-height: 1.2; font-weight: 700; color: var(--c); white-space: nowrap; }
  .card small { display: block; font-size: 1.9vh; line-height: 1.25; color: #b9bee0; margin-top: 0.2vh; white-space: nowrap; }
  .card q { display: block; font-size: 2.1vh; line-height: 1.25; color: #e8eaf6; font-style: italic; margin-top: 0.4vh; quotes: none; white-space: nowrap; }
</style>
<body>
  <div class="guide"></div>
  <div class="cards">
    <div class="title"><b><span>1-Minute</span> Sleep Journal</b><i>Two quick check-ins a day</i></div>
    <div class="card"><span class="ic">☾</span><div><b>Bedtime ✓</b><small>in bed 11:10 PM · trying 11:20 PM</small><q>Read for half an hour, then lights out.</q></div></div>
    <div class="card morning"><span class="ic">☀</span><div><b>Morning ✓</b><small>woke 6:55 AM · 15m to fall asleep · rested 4/5</small><q>Dream: a fox walked me home.</q></div></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('guide')) document.body.classList.add('show-guide');
  </script>
</body>
